[package]
name = "moontier-root-manager"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
easytier = { git = "https://github.com/EasyTier/EasyTier.git", tag = "v2.6.4", default-features = false, features = ["zstd"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = "1"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
